name: Deploy to GitHub Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency: { group: pages, cancel-in-progress: true }
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: npm test
      - run: BASE=/${{ github.event.repository.name }}/ npm run build
        env:
          # Optional relay (TURN) server so every device can connect. Set these in
          # Settings → Secrets and variables → Actions (see README).
          VITE_TURN_URLS: ${{ vars.TURN_URLS }}
          VITE_TURN_USER: ${{ vars.TURN_USER }}
          VITE_TURN_PASS: ${{ secrets.TURN_PASS }}
      - uses: actions/upload-pages-artifact@v3
        with: { path: packages/client/dist }
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment: { name: github-pages, url: '${{ steps.d.outputs.page_url }}' }
    steps:
      - id: d
        uses: actions/deploy-pages@v4
